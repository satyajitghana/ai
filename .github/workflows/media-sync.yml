# Mirror the films and thumbnails to Cloudflare R2, which serves them at
# https://media.thesatyajit.com (plans/03-media-analytics-distribution.md).
#
# The files stay committed under public/: `pnpm validate:films` checks them,
# and the OG images read the thumbnails at build. This only copies them to the
# bucket, so plays cost R2 (no egress charge) instead of Vercel bandwidth, once
# NEXT_PUBLIC_MEDIA_BASE points the site there (lib/media.ts).
#
# Needs repository secrets from an R2 API token with Object Read & Write on
# the bucket: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_ENDPOINT (the S3
# endpoint Cloudflare shows with the token, the jurisdiction one if the bucket
# has a jurisdiction, e.g. https://<account>.eu.r2.cloudflarestorage.com).
# R2_ACCOUNT_ID works in place of R2_ENDPOINT for a bucket with no
# jurisdiction. The token's own "token value" is for Cloudflare's API and is
# not used. The repository variable R2_BUCKET overrides the bucket name.
# Until the secrets exist, every run is a no-op that says so.
#
# Keep the secrets in the `media` environment (Settings → Environments →
# media → Deployment branches: master only) rather than as repository
# secrets: then no workflow on any other branch can read them, even one a
# collaborator pushes. Fork pull requests never receive secrets either way,
# and this workflow has no pull_request trigger at all.

name: media-sync

on:
  push:
    branches: [master]
    paths:
      - "public/films/**"
      - "public/thumbs/**"
      - ".github/workflows/media-sync.yml"
  workflow_dispatch:

concurrency:
  group: media-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: media
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'ai-thesatyajit-media' }}
      MEDIA_BASE: https://media.thesatyajit.com
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Check the R2 secrets
        id: gate
        run: |
          if { [ -z "$R2_ENDPOINT" ] && [ -z "$R2_ACCOUNT_ID" ]; } || [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]; then
            echo "::notice::R2 secrets are not set, so nothing was synced."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The endpoint as pasted, less a trailing slash or /<bucket> (the
          # bucket page shows it with the bucket appended); else the default one.
          ep="${R2_ENDPOINT:-https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}"
          ep="${ep%/}"; ep="${ep%/$R2_BUCKET}"
          echo "RCLONE_CONFIG_R2_ENDPOINT=$ep" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Only the two media folders, one commit deep: the full history is ~750 MB.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 1
          sparse-checkout: |
            public/films
            public/thumbs
            data/.generated

      - name: Install rclone
        if: steps.gate.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone && rclone version | head -1

      # --checksum compares MD5s (R2 keeps one for every single-part upload),
      # because a fresh checkout gives every file a new mtime. A year's
      # immutable caching is safe because the site links each film and
      # thumbnail with ?v=<its render hash> (lib/media.ts), so a re-render is a
      # new URL. `sync` also deletes objects whose file was deleted here.
      - name: Sync films and thumbnails
        if: steps.gate.outputs.ok == 'true'
        run: |
          for d in films thumbs; do
            rclone sync "public/$d" "r2:$R2_BUCKET/$d" \
              --checksum --fast-list --transfers 8 \
              --header-upload "Cache-Control: public, max-age=31536000, immutable" \
              --stats-one-line -v
          done

      # A read through the custom domain, as a visitor would make it. Informational
      # until the domain is attached to the bucket.
      - name: Check one film through the custom domain
        if: steps.gate.outputs.ok == 'true'
        continue-on-error: true
        run: |
          slug=$(python3 -c "import json; print(next(iter(json.load(open('data/.generated/films.json'))['films'])))")
          curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download} bytes  $MEDIA_BASE/films/$slug.mp4\n" --range 0-1023 "$MEDIA_BASE/films/$slug.mp4"

# Mirror the films, thumbnails and article images and clips to Cloudflare R2,
# which serves them at https://media.thesatyajit.com/ai/, and publish
# ai/index.json, the list the site's build checks before linking any of them
# there (lib/media.ts, scripts/media-map.mts; roadmap/03-media-analytics-distribution.md).
#
# The bucket is shared by every thesatyajit.com site, one top-level prefix
# each: this repository owns ai/ and nothing else. Every rclone target below
# is under ai/, so `sync`'s deletions can never reach another site's files.
#
# The files stay committed under public/: `pnpm validate:films` checks them,
# and the OG images read the thumbnails at build. This only copies them to the
# bucket, so plays cost R2 (no egress charge) instead of Vercel bandwidth, once
# NEXT_PUBLIC_MEDIA_BASE points the site there (lib/media.ts).
#
# Needs repository secrets from an R2 API token with Object Read & Write on
# the bucket: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, and R2_ENDPOINT (the S3
# endpoint Cloudflare shows with the token, the jurisdiction one if the bucket
# has a jurisdiction, e.g. https://<account>.eu.r2.cloudflarestorage.com).
# R2_ACCOUNT_ID works in place of R2_ENDPOINT for a bucket with no
# jurisdiction. The token's own "token value" is for Cloudflare's API and is
# not used. The repository variable R2_BUCKET overrides the bucket name.
# Until the secrets exist, every run is a no-op that says so.
#
# Keep the secrets in the `media` environment (Settings → Environments →
# media → Deployment branches: master only) rather than as repository
# secrets: then no workflow on any other branch can read them, even one a
# collaborator pushes. Fork pull requests never receive secrets either way,
# and this workflow has no pull_request trigger at all.

name: media-sync

on:
  push:
    branches: [master]
    paths:
      - "public/films/**"
      - "public/thumbs/**"
      - "public/articles/**"
      - ".github/workflows/media-sync.yml"
  workflow_dispatch:

concurrency:
  group: media-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: media
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'ai-thesatyajit-media' }}
      # this site's prefix in the shared bucket; the site's NEXT_PUBLIC_MEDIA_BASE is MEDIA_BASE/PREFIX
      PREFIX: ai
      MEDIA_BASE: https://media.thesatyajit.com
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Cloudflare's documented rclone setup for R2
      # (developers.cloudflare.com/r2/examples/rclone): acl private, and
      # no_check_bucket for a token scoped to objects in one bucket.
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
    steps:
      - name: Check the R2 secrets
        id: gate
        run: |
          if { [ -z "$R2_ENDPOINT" ] && [ -z "$R2_ACCOUNT_ID" ]; } || [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]; then
            echo "::notice::R2 secrets are not set, so nothing was synced."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The endpoint as pasted, less a trailing slash or /<bucket> (the
          # bucket page shows it with the bucket appended); else the default one.
          ep="${R2_ENDPOINT:-https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com}"
          ep="${ep%/}"; ep="${ep%/$R2_BUCKET}"
          echo "RCLONE_CONFIG_R2_ENDPOINT=$ep" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Only the two media folders, one commit deep: the full history is ~750 MB.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 1
          sparse-checkout: |
            public/films
            public/thumbs
            public/articles
            data/.generated

      # Pinned and checksum-verified from rclone.org. Ubuntu's package is
      # rclone 1.60.1 (2022): against R2 it stored every object and still
      # reported each upload as "501 NotImplemented", so the step failed.
      - name: Install rclone
        if: steps.gate.outputs.ok == 'true'
        run: |
          V=v1.75.1; Z=rclone-$V-linux-amd64.zip
          curl -fsSL -o "$Z" "https://downloads.rclone.org/$V/$Z"
          curl -fsSL -o SHA256SUMS "https://downloads.rclone.org/$V/SHA256SUMS"
          grep " $Z\$" SHA256SUMS | sha256sum -c -
          unzip -q "$Z" && sudo install -m 0755 "rclone-$V-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf "$Z" SHA256SUMS "rclone-$V-linux-amd64"
          rclone version | head -1

      # One small upload first, with R2's full response in the log, so a
      # misconfiguration fails in one clear line instead of hundreds.
      # --dump never prints credentials (Authorization is redacted).
      - name: Canary upload
        if: steps.gate.outputs.ok == 'true'
        run: |
          case "$PREFIX" in ""|*/*|.*) echo "::error::refusing to use prefix '$PREFIX'"; exit 1;; esac
          f=$(ls public/thumbs/*.jpg | head -1)
          dest="r2:$R2_BUCKET/$PREFIX/.canary/$(basename "$f")"
          rclone copyto "$f" "$dest" --header-upload "Cache-Control: no-store" -vv --dump headers,responses --retries 1
          rclone deletefile "$dest" -v

      # --checksum compares MD5s (R2 keeps one for every single-part upload),
      # because a fresh checkout gives every file a new mtime. A year's
      # immutable caching is safe because the site links each film and
      # thumbnail with ?v=<its render hash> (lib/media.ts), so a re-render is a
      # new URL. `sync` also deletes objects whose file was deleted here, which
      # is why every target is under $PREFIX. Both folders run even if one fails.
      - name: Sync films and thumbnails
        if: steps.gate.outputs.ok == 'true'
        run: |
          case "$PREFIX" in ""|*/*|.*) echo "::error::refusing to sync with prefix '$PREFIX'"; exit 1;; esac
          rc=0
          # Only images and videos: captions, the JSON <Receipts> reads and the
          # data files interactives fetch stay same-origin (lib/media.ts).
          # rclone applies these filters to deletions too.
          for d in thumbs films articles; do
            rclone sync "public/$d" "r2:$R2_BUCKET/$PREFIX/$d" \
              --include "*.{png,jpg,jpeg,webp,gif,svg,avif,mp4,webm}" \
              --checksum --fast-list --transfers 16 \
              --header-upload "Cache-Control: public, max-age=31536000, immutable" \
              --stats-one-line -v || rc=1
          done
          exit $rc

      # The index goes up last, and only after every sync succeeded: a path it
      # lists is in the bucket with that content. A build serves a file from R2
      # only when the hash here matches its own copy (scripts/media-map.mts), so a
      # stale or missing index degrades to same-origin, never to a broken link.
      - name: Publish the media index
        if: steps.gate.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          exts = {".png", ".jpg", ".jpeg", ".webp", ".gif", ".svg", ".avif", ".mp4", ".webm"}
          files = {}
          for top in ("thumbs", "films", "articles"):
              for dp, _, names in os.walk(os.path.join("public", top)):
                  for n in names:
                      if os.path.splitext(n)[1].lower() not in exts:
                          continue
                      p = os.path.join(dp, n)
                      with open(p, "rb") as f:
                          files["/" + os.path.relpath(p, "public")] = hashlib.sha256(f.read()).hexdigest()[:16]
          json.dump({"version": 1, "commit": os.environ["GITHUB_SHA"], "files": dict(sorted(files.items()))},
                    open("index.json", "w"), separators=(",", ":"))
          print(f"{len(files)} files indexed")
          PY
          rclone copyto index.json "r2:$R2_BUCKET/$PREFIX/index.json" \
            --header-upload "Cache-Control: public, max-age=60" --header-upload "Content-Type: application/json" -v

      # A read through the custom domain, as a visitor would make it. Informational
      # until the domain is attached to the bucket.
      - name: Check one film through the custom domain
        if: steps.gate.outputs.ok == 'true'
        continue-on-error: true
        run: |
          slug=$(python3 -c "import json; print(next(iter(json.load(open('data/.generated/films.json'))['films'])))")
          url="$MEDIA_BASE/$PREFIX/films/$slug.mp4"
          curl -sS -o /dev/null -w "%{http_code} %{content_type} %{size_download} bytes  $url\n" --range 0-1023 "$url"

# IndexNow: when a production deployment is ready, tell Bing (and every engine
# that shares IndexNow: Yandex, Seznam, Naver) which pages it added or changed,
# so a new article is crawled in hours instead of whenever the sitemap is next
# read. Google does not use IndexNow; it reads the sitemap.
#
# Needs no secret. The key is public by design: IndexNow proves ownership by
# fetching it from https://ai.satyajit.si/<key>.txt (public/<key>.txt), so
# anyone may read it, and only this host's URLs can be submitted with it.
#
# Which pages: the content files that changed between the previous production
# deployment and this one, mapped to their URLs, plus the index pages of their
# sections and the home page. Nothing changed under content/ means no ping:
# resubmitting unchanged URLs is what IndexNow asks clients not to do.

name: indexnow

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  ping:
    # Vercel names its GitHub environments "Production" or "Production – <project>"
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    env:
      HOST: ai.satyajit.si
      KEY: f956b77a6c858873abc6e272dc2269d2
      SHA: ${{ github.event.deployment.sha }}
      ENVIRONMENT: ${{ github.event.deployment.environment }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 100
      - name: Submit the changed pages
        run: |
          set -euo pipefail
          # The deployment before this one in the same environment (any state:
          # a failed one in between only widens the diff, never narrows it).
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=$(jq -rn --arg e "$ENVIRONMENT" '$e|@uri')&per_page=20" \
            --jq "[.[] | select(.sha != \"$SHA\")][0].sha // empty" || true)
          if [ -z "$prev" ] || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            echo "::notice::No earlier production deployment in reach; diffing against the parent commit."
            prev=$(git rev-parse "$SHA~1")
          fi
          echo "diff $prev..$SHA"

          urls=$(git diff --name-only --diff-filter=AM "$prev" "$SHA" -- content/ \
            | sed -nE 's#^content/(articles|architectures|blog|notes|projects|logs|arxiv)/([^/]+)\.mdx$#\1 \2#p' \
            | while read -r kind slug; do
                echo "https://$HOST/$kind/$slug"
                echo "https://$HOST/$kind"
              done | sort -u)
          if [ -z "$urls" ]; then
            echo "::notice::No content changed in this deployment; nothing to submit."
            exit 0
          fi
          urls=$(printf '%s\nhttps://%s/\n' "$urls" "$HOST" | sort -u | head -n 10000)
          echo "$urls"

          body=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg host "$HOST" --arg key "$KEY" --arg loc "https://$HOST/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: .}')
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data "$body")
          echo "IndexNow answered $code"; cat /tmp/indexnow.out || true
          # 200 OK and 202 Accepted are success; anything else is worth a red run.
          [ "$code" = "200" ] || [ "$code" = "202" ]

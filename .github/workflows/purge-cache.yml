# Cloudflare caches ai.thesatyajit.com's pages at the edge for a day (a Cache
# Rule on the zone), so Vercel serves each page about once a day per Cloudflare
# region instead of on every view; every view it serves is an ISR read. A
# deploy would otherwise stay invisible for up to that day, so when Vercel
# reports a production deployment ready, this purges the site's host.
#
# Only ai.thesatyajit.com: media.thesatyajit.com URLs carry a content hash
# (lib/media.ts) and never go stale, and the zone serves other sites.
#
# Needs the repository secret CLOUDFLARE_PURGE_TOKEN: a Cloudflare API token
# with Zone → Cache Purge → Purge on thesatyajit.com and nothing else. Until it
# exists, every run is a no-op that says so.

name: purge-cache

on:
  deployment_status:

permissions: {}

jobs:
  purge:
    # Vercel names its GitHub environments "Production" or "Production – <project>"
    if: github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    env:
      ZONE_ID: 15a3b42cff31a59108ff307aa6bd2992
      HOST: ai.thesatyajit.com
      TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
    steps:
      - name: Purge the site's pages from Cloudflare
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_PURGE_TOKEN is not set, so nothing was purged."
            exit 0
          fi
          res=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"$HOST\"]}")
          echo "$res"
          echo "$res" | grep -q '"success":true'

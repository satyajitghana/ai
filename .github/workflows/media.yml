# Media lives in Cloudflare R2, not git (lib/media.ts). On every pull request
# this checks that the branch commits no media and that every lib/media-map.json
# entry it adds or changes is really in R2 with that content: a map entry whose
# upload never happened would otherwise ship a page that 404s.
#
# It needs no secrets. The upload itself is `pnpm media:push`, run by whoever
# made the media (a local checkout or a Claude Code cloud session), with an R2
# token in their environment.

name: media

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the base branch's media map
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: No committed media, and every new map entry is in R2
        run: pnpm validate:media --remote=origin/${{ github.base_ref }}

[workspace]
members = ["crates/apply-patch", "crates/path-uri", "crates/exec-server-stub", "crates/shellprobe", "crates/execpolicy", "crates/absolute-path"]
resolver = "2"
[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
[workspace.lints]
[workspace.dependencies]
codex-exec-server = { path = "crates/exec-server-stub" }
codex-utils-path-uri = { path = "crates/path-uri" }
codex-utils-cargo-bin = { path = "crates/cargo-bin-none" }
similar = "2.7.0"
assert_cmd = "2"
assert_matches = "1.5.0"
urlencoding = "2.1"
codex-utils-absolute-path = { path = "crates/absolute-path" }
anyhow = "1"
clap = "4"
dirs = "6"
dunce = "1.0.4"
multimap = "0.10.0"
pretty_assertions = "1.4.1"
schemars = "0.8.22"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = "1"
ts-rs = "11"
base64 = "0.22.1"
libc = "0.2.182"
once_cell = "1.20.2"
regex = "1.12.3"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "=0.26.4"
url = "2"
which = "8"

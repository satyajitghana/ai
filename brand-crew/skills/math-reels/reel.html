<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Math reel</title>
<!--
  The math-reel page. render.mjs opens it headless at 1280x720, calls
  REEL.load(spec) once and REEL.frame(t) per frame, and screenshots the page:
  graphics are painted on #c (Canvas2D), every piece of text (and all math,
  through KaTeX) is a DOM element in #ui laid over it in the same pixel
  coordinates, inside one div per camera layer (.layer) that carries the same
  matrix as the canvas. No will-change: text must re-raster at the camera's
  scale, not be scaled as a bitmap. Nothing animates on its own: no CSS transitions, no timers, so a
  frame is a pure function of t. KaTeX is loaded from the repo's node_modules,
  whose location render.mjs passes as ?katex=<file URL of katex/dist/>.
-->
<style>
@font-face { font-family: 'Hanken Grotesk'; src: url(fonts/HankenGrotesk-100-900.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/IBMPlexMono-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/IBMPlexMono-500.woff2) format('woff2'); font-weight: 500; }
/* Latin Extended-A and friends (Lazić, Forstnerič, Erdős), Google Fonts' latin-ext subsets, OFL */
@font-face { font-family: 'Hanken Grotesk'; src: url(fonts/HankenGrotesk-100-900-latin-ext.woff2) format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F, U+0259, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0300-0304, U+0308-0309, U+0323, U+1E80-1E85, U+1E9E, U+1EF2-1EF9, U+20AB, U+20AC, U+2113; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/IBMPlexMono-400-latin-ext.woff2) format('woff2'); font-weight: 400; unicode-range: U+0100-024F, U+0259, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0300-0304, U+0308-0309, U+0323, U+1E80-1E85, U+1E9E, U+1EF2-1EF9, U+20AB, U+20AC, U+2113; }
@font-face { font-family: 'IBM Plex Mono'; src: url(fonts/IBMPlexMono-500-latin-ext.woff2) format('woff2'); font-weight: 500; unicode-range: U+0100-024F, U+0259, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0300-0304, U+0308-0309, U+0323, U+1E80-1E85, U+1E9E, U+1EF2-1EF9, U+20AB, U+20AC, U+2113; }
html, body { margin: 0; padding: 0; background: #0b0d12; overflow: hidden; }
#stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
#c { position: absolute; left: 0; top: 0; }
#ui { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; pointer-events: none; }
#ui .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
#ui .lb { position: absolute; left: 0; top: 0; white-space: nowrap; transform-origin: 0 0;
  font-family: 'Hanken Grotesk', sans-serif; color: #ECE9E2; font-size: 26px; line-height: 1.25; font-weight: 450;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; font-kerning: normal; }
#ui .wrap { white-space: normal; }
#ui .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; letter-spacing: 0; }
#ui .caps { text-transform: uppercase; letter-spacing: .12em; font-weight: 600; }
#ui .katex { font-size: 1.08em; }
#ui .caps .katex { text-transform: none; letter-spacing: 0; }
#ui .katex-display { margin: 0; }
#probe { position: absolute; left: -4000px; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="ui"></div></div>
<div id="probe"></div>
<script src="engine/reel.js"></script>
</body>
</html>

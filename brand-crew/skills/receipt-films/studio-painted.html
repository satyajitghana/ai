<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Receipts studio (painted)</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(fonts/PermanentMarker-400.woff2) format('woff2'); }
  @font-face { font-family: Hanken; src: url(fonts/HankenGrotesk-100-900.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: Plex; src: url(fonts/IBMPlexMono-500.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: Plex; src: url(fonts/IBMPlexMono-600.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Plex; src: url(fonts/IBMPlexMono-700.woff2) format('woff2'); font-weight: 700; }
  html, body { margin: 0; background: #222; }
  canvas { display: block; width: 100vw; max-width: 1280px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine/paint.js"></script>
<!-- the character: vendored, unmodified -->
<script src="../claude-animation-base/src/clawd.js"></script>
<script src="engine/painted.js"></script>
<script>
  window.READY = (async () => {
    await Promise.all(['100px "Permanent Marker"', '800 40px Hanken', '700 40px Hanken', '600 40px Hanken',
      '500 20px Plex', '600 20px Plex', '700 20px Plex'].map(f => document.fonts.load(f)))
    paintInit(document.getElementById('c'))
    return true
  })()
</script>
</body>
</html>
